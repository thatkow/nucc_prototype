<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NUCC Trip Locations Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top, #070809 0%, #020203 55%, #020203 100%);
      color: #f5f5f5;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: clamp(1.25rem, 3vw, 2.5rem) clamp(1.5rem, 5vw, 4rem);
      text-align: center;
      background: linear-gradient(180deg, rgba(14, 18, 22, 0.85) 0%, rgba(7, 7, 7, 0.9) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      z-index: 5;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.75rem, 3vw, 2.8rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    header p {
      margin: clamp(0.75rem, 2vw, 1.25rem) auto 0;
      max-width: min(68ch, 90vw);
      font-size: clamp(0.95rem, 2.4vw, 1.1rem);
      line-height: 1.55;
      color: rgba(245, 245, 245, 0.8);
    }

    main {
      flex: 1;
      position: relative;
      display: flex;
      min-height: 0;
    }

    .map-frame {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .card-column {
      position: absolute;
      top: clamp(1.5rem, 6vh, 3.5rem);
      bottom: clamp(1.5rem, 6vh, 3.5rem);
      width: min(340px, 28vw);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      gap: clamp(1rem, 2.6vw, 1.6rem);
      align-content: space-between;
      pointer-events: none;
      z-index: 410;
    }

    .card-column.left {
      left: clamp(1rem, 4vw, 3rem);
      align-items: flex-start;
    }

    .card-column.right {
      right: clamp(1rem, 4vw, 3rem);
      align-items: flex-end;
    }

    .location-card {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      background: rgba(10, 12, 14, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: clamp(0.85rem, 2.2vw, 1.25rem);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      display: grid;
      gap: 0.7rem;
      align-content: start;
      cursor: pointer;
      outline: none;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .card-column.right .location-card {
      text-align: right;
    }

    .location-card:hover,
    .location-card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.55);
    }

    .location-card img {
      width: 100%;
      height: clamp(120px, 22vh, 160px);
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .location-type {
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

    .card-column.right .location-type {
      justify-self: end;
    }

    .location-card h3 {
      margin: 0;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .location-card p {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: clamp(0.92rem, 2.2vw, 1rem);
      line-height: 1.5;
    }

    .location-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .connector-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 405;
    }

    .connector-layer path {
      fill: none;
      stroke-width: 2.4px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.65));
    }

    .connector-layer path[data-type="canyon"] {
      stroke: rgba(0, 140, 255, 0.85);
    }

    .connector-layer path[data-type="cave"] {
      stroke: rgba(240, 90, 30, 0.85);
    }

    .popup-content {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      text-align: center;
      width: min(220px, 60vw);
    }

    .popup-content img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .popup-type {
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

    .popup-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .popup-desc {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.82);
    }

    .legend {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: clamp(1rem, 5vh, 2.5rem);
      display: grid;
      gap: 0.45rem;
      padding: 0.85rem 1.2rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(10, 10, 12, 0.82);
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.82rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      z-index: 420;
      pointer-events: none;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 1100px) {
      .card-column {
        width: min(280px, 34vw);
        gap: 1rem;
      }

      .location-card {
        padding: 0.9rem;
      }
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      main {
        flex-direction: column;
      }

      .map-frame {
        min-height: 70vh;
      }

      .card-column {
        position: static;
        width: auto;
        padding: clamp(1.25rem, 4vw, 2rem) clamp(1.5rem, 5vw, 2.5rem) 0;
        display: flex;
        flex-direction: column;
        gap: clamp(1rem, 4vw, 1.5rem);
        pointer-events: auto;
      }

      .card-column.right {
        margin-top: -0.25rem;
      }

      .card-column.right .location-card,
      .card-column.left .location-card {
        text-align: left;
      }

      .card-column.right .location-type {
        justify-self: start;
      }

      .connector-layer {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>NUCC trip destinations</h1>
    <p>
      Explore the caves and canyons that NUCC has visited across recent trip reports. The cascading cards highlight each
      location—select one to fly across the map and preview photos and notes from those adventures.
    </p>
  </header>

  <main>
    <div class="map-frame">
      <div id="map" role="region" aria-label="Interactive map of NUCC trip destinations"></div>
      <svg class="connector-layer" aria-hidden="true"></svg>
      <section class="card-column left" aria-label="Western trip destinations"></section>
      <section class="card-column right" aria-label="Eastern trip destinations"></section>
      <div class="legend" aria-hidden="true">
        <div class="legend-row">
          <span class="legend-swatch" style="background: rgba(0, 140, 255, 0.7);"></span>
          <span>Canyon destinations</span>
        </div>
        <div class="legend-row">
          <span class="legend-swatch" style="background: rgba(240, 90, 30, 0.65);"></span>
          <span>Cave systems</span>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map', {
      center: [-35.3, 149.1],
      zoom: 6,
      scrollWheelZoom: true,
      dragging: true,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const rawLocations = [
      {
        name: 'Jenolan Caves',
        coords: [-33.8204, 150.0208],
        type: 'cave',
        image: 'images/caving/IMG_0325.jpg',
        description:
          "2019’s Jenolan Jaunt split teams between Mammoth, Aladdin and Hennings caves while sharing the beloved cavers’ cottage."
      },
      {
        name: 'Tuglow Caves',
        coords: [-33.978, 149.932],
        type: 'cave',
        image: 'images/caving/PXL_20241207_045338331.MP.jpg',
        description:
          'Trip listings keep inviting NUCC members on dedicated Tuglow caving weekends to tackle the classic stream passages.'
      },
      {
        name: 'Macquarie Pass Canyon',
        coords: [-34.56339850147471, 150.65913525198138],
        type: 'canyon',
        image: 'images/canyoning/IMG_3038.jpeg',
        description:
          'Regular Macquarie Pass canyoning listings stay on the NUCC calendar for keen members chasing waterfalls.'
      },
      {
        name: 'Bungonia Caves',
        coords: [-34.776, 150.006],
        type: 'cave',
        image: 'images/caving/PXL_20241013_012316349.jpg',
        description:
          'Beginner Bungonia trips funnel new cavers through B4-5, squeezes near Root 19 and the Shoalhaven lookouts.'
      },
      {
        name: 'Jerrara Canyon',
        coords: [-34.79220931218591, 149.99944698033696],
        type: 'canyon',
        image: 'images/canyoning/IMG_3067.jpeg',
        description:
          'Jerrara Canyon outings remain a friendly beginner option with sunny creek sections and gentle abseils.'
      },
      {
        name: 'Buchan Caves',
        coords: [-37.495, 148.168],
        type: 'cave',
        image: 'images/caving/PXL_20241206_223021079.jpg',
        description:
          'Club calendars continue to advertise Buchan caving weekends for NUCC members looking for longer road trips.'
      },
      {
        name: 'Mount Fairy Karst',
        coords: [-35.018, 149.583],
        type: 'cave',
        image: 'images/caving/PXL_20241206_223338198.jpg',
        description:
          'Mount Fairy missions revive NUCC’s surveying habit, squeezing past new finds while mapping the main cave system.'
      },
      {
        name: 'Wee Jasper',
        coords: [-35.107, 148.689],
        type: 'cave',
        image: 'images/caving/PXL_20241207_000415603.jpg',
        description:
          'Dip Cave days at Wee Jasper tackle Series 4 and 5, Dismal Chamber and the crawl out the Rubbish Tip entrance.'
      },
      {
        name: 'Cooleman Plains',
        coords: [-35.56, 148.52],
        type: 'cave',
        image: 'images/caving/PXL_20241206_221557516.MP.jpg',
        description:
          'Cooleman Plains Easter camps link up with SUSS and ROC while surveying Black Range Cave and revisiting Cooleman Main.'
      },
      {
        name: 'Wyanbene Caves',
        coords: [-35.8798, 149.986],
        type: 'cave',
        image: 'images/caving/PXL_20241013_032228590.jpg',
        description:
          'Streamway pushes at Wyanbene take teams through chill crawls to the Helictite Chamber and the towering Gunbarrel Aven.'
      },
      {
        name: 'Yagby Caves',
        coords: [-35.9, 148.9],
        type: 'cave',
        image: 'images/caving/PXL_20241013_020527445.jpg',
        description:
          'Snowy Yagby weekends mean trudging through drifts to reach East Deep Creek, Restoration Cave and other decorated chambers.'
      },
      {
        name: 'Bendethera Caves',
        coords: [-36.032, 149.619],
        type: 'cave',
        image: 'images/caving/IMG_1432.jpg',
        description:
          'Bendethera excursions combine remote 4WD access with camping in the Deua valley and lengthy river cave explorations.'
      }
    ];

    const locationLookup = new Map(rawLocations.map(location => [location.name, location]));

    const layoutPlan = {
      left: [
        'Mount Fairy Karst',
        'Wee Jasper',
        'Cooleman Plains',
        'Wyanbene Caves',
        'Yagby Caves',
        'Bendethera Caves'
      ],
      right: [
        'Jenolan Caves',
        'Tuglow Caves',
        'Macquarie Pass Canyon',
        'Bungonia Caves',
        'Jerrara Canyon',
        'Buchan Caves'
      ]
    };

    const locationData = [];

    Object.entries(layoutPlan).forEach(([side, names]) => {
      names.forEach((name, index) => {
        const base = locationLookup.get(name);
        if (!base) {
          console.warn(`Missing location data for ${name}`);
          return;
        }

        const row = Math.floor(index / 2) + 1;
        const column = (index % 2) + 1;

        locationData.push({
          ...base,
          side,
          row,
          column,
          layoutIndex: index
        });
      });
    });

    const grouped = {
      left: locationData.filter(entry => entry.side === 'left').sort((a, b) => a.layoutIndex - b.layoutIndex),
      right: locationData.filter(entry => entry.side === 'right').sort((a, b) => a.layoutIndex - b.layoutIndex)
    };

    const columns = {
      left: document.querySelector('.card-column.left'),
      right: document.querySelector('.card-column.right')
    };

    const connectorLayer = document.querySelector('.connector-layer');
    const mapFrame = document.querySelector('.map-frame');

    const connectors = [];
    const featureGroup = L.featureGroup().addTo(map);

    const TYPE_COLORS = {
      canyon: {
        stroke: '#008cff',
        fill: 'rgba(0, 140, 255, 0.32)'
      },
      cave: {
        stroke: '#f05a1e',
        fill: 'rgba(240, 90, 30, 0.28)'
      }
    };

    function buildCard(location, marker) {
      const card = document.createElement('article');
      card.className = 'location-card';
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', `Focus map on ${location.name}`);
      card.style.gridRow = String(location.row);
      card.style.gridColumn = String(location.column);
      card.dataset.type = location.type;
      card.dataset.side = location.side;
      card.dataset.row = String(location.row);
      card.dataset.column = String(location.column);

      const image = document.createElement('img');
      image.src = location.image;
      image.alt = `${location.name} trip photo`;

      const typeLabel = document.createElement('span');
      typeLabel.className = 'location-type';
      typeLabel.textContent = location.type === 'canyon' ? 'Canyon' : 'Cave system';

      const heading = document.createElement('h3');
      heading.textContent = location.name;

      const description = document.createElement('p');
      description.textContent = location.description;

      const focusLocation = () => {
        const targetZoom = Math.max(map.getZoom(), 9);
        map.flyTo(location.coords, targetZoom, { duration: 0.65 });
        setTimeout(() => {
          marker.openPopup();
        }, 650);
      };

      card.addEventListener('click', focusLocation);
      card.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          focusLocation();
        }
      });

      image.addEventListener('load', scheduleConnectorUpdate);

      card.append(image, typeLabel, heading, description);
      return card;
    }

    function addLocation(location) {
      const palette = TYPE_COLORS[location.type] || TYPE_COLORS.cave;

      const circle = L.circle(location.coords, {
        radius: 6000,
        color: palette.stroke,
        fillColor: palette.fill,
        fillOpacity: 0.5,
        weight: 2
      }).addTo(map);

      const marker = L.marker(location.coords).addTo(map);

      const popupContent = `
        <article class="popup-content">
          <img src="${location.image}" alt="${location.name} trip photo">
          <span class="popup-type">${location.type === 'canyon' ? 'Canyon' : 'Cave system'}</span>
          <h3 class="popup-title">${location.name}</h3>
          <p class="popup-desc">${location.description}</p>
        </article>
      `;

      circle.bindPopup(popupContent);
      marker.bindPopup(popupContent);

      featureGroup.addLayer(circle);
      featureGroup.addLayer(marker);

      const card = buildCard(location, marker);
      columns[location.side].appendChild(card);

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.dataset.type = location.type;
      connectorLayer.appendChild(path);

      connectors.push({
        marker,
        card,
        path,
        side: location.side,
        column: location.column,
        row: location.row
      });
    }

    grouped.left.forEach(addLocation);
    grouped.right.forEach(addLocation);

    if (featureGroup.getLayers().length > 0) {
      map.fitBounds(featureGroup.getBounds().pad(0.25));
    }
    scheduleConnectorUpdate();

    function updateConnectors() {
      if (!mapFrame.isConnected) {
        return;
      }

      const isStacked = window.matchMedia('(max-width: 900px)').matches;
      if (isStacked) {
        connectorLayer.setAttribute('width', 0);
        connectorLayer.setAttribute('height', 0);
        connectors.forEach(entry => {
          entry.path.setAttribute('d', '');
        });
        return;
      }

      const frameRect = mapFrame.getBoundingClientRect();
      const width = frameRect.width;
      const height = frameRect.height;

      connectorLayer.setAttribute('viewBox', `0 0 ${width} ${height}`);
      connectorLayer.setAttribute('width', width);
      connectorLayer.setAttribute('height', height);

      connectors.forEach(entry => {
        const markerPoint = map.latLngToContainerPoint(entry.marker.getLatLng());
        if (!markerPoint) {
          entry.path.setAttribute('d', '');
          return;
        }

        const cardRect = entry.card.getBoundingClientRect();
        const cardX = entry.side === 'left'
          ? cardRect.right - frameRect.left
          : cardRect.left - frameRect.left;
        const verticalShift = entry.column === 1 ? -12 : 12;
        const cardY = cardRect.top + cardRect.height / 2 - frameRect.top + verticalShift;

        const elbowOffset = entry.side === 'left'
          ? 40 + (2 - entry.column) * 18
          : 40 + (entry.column - 1) * 18;

        const elbowX = entry.side === 'left'
          ? Math.min(cardX + elbowOffset, width)
          : Math.max(cardX - elbowOffset, 0);

        const approachX = entry.side === 'left'
          ? Math.max(markerPoint.x - 24, elbowX)
          : Math.min(markerPoint.x + 24, elbowX);

        const control1X = (cardX + elbowX) / 2;
        const control2X = (approachX + markerPoint.x) / 2;

        const pathData = `M ${cardX} ${cardY} C ${control1X} ${cardY} ${control2X} ${markerPoint.y} ${markerPoint.x} ${markerPoint.y}`;

        entry.path.setAttribute('d', pathData);
      });
    }

    let scheduled = false;
    function scheduleConnectorUpdate() {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(() => {
        scheduled = false;
        updateConnectors();
      });
    }

    map.on('move zoom resize', scheduleConnectorUpdate);
    map.on('layeradd', scheduleConnectorUpdate);
    map.whenReady(scheduleConnectorUpdate);
    window.addEventListener('resize', scheduleConnectorUpdate);
    window.addEventListener('load', scheduleConnectorUpdate);
  </script>
</body>
</html>
